spring.application.name=Distribution-Delivery
spring.datasource.url=jdbc:mysql://localhost:3306/distribution_delivery_database
spring.datasource.username=root
spring.datasource.password=ctssql2026
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=8083
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# Feign
resilience4j.retry.instances.feignRetry.max-attempts=3
resilience4j.retry.instances.feignRetry.wait-duration=2s
resilience4j.retry.instances.feignRetry.retry-exceptions=\
  feign.RetryableException,\
  java.io.IOException

spring.cloud.openfeign.circuitbreaker.enabled=false

# Circuit Breaker config
resilience4j.circuitbreaker.instances.titleCircuitBreaker.sliding-window-size=5
resilience4j.circuitbreaker.instances.titleCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.titleCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.titleCircuitBreaker.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.titleCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true

# Partner Circuit Breaker
resilience4j.circuitbreaker.instances.partnerCircuitBreaker.sliding-window-size=5
resilience4j.circuitbreaker.instances.partnerCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.partnerCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.partnerCircuitBreaker.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.partnerCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true