spring.application.name=API-Gateway
server.port=8082

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

jwt.secret=Streamcast_Secure_Key_2026_Project_Very_Strong_Key_12345

# ── Route 0: Auth (pre-login) ── Identity-Auth-Service
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://Identity-Auth-Service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

# ── Route 1: User management ── Identity-Auth-Service
spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://Identity-Auth-Service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/users/**

# ── Route 2: Role management ── Identity-Auth-Service
spring.cloud.gateway.server.webflux.routes[2].id=role-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://Identity-Auth-Service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/roles/**

# ── Route 3: Distribution & Delivery
spring.cloud.gateway.server.webflux.routes[3].id=distribution-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://Distribution-Delivery
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/manifests/**

# ── Route 4: Usage reporting
spring.cloud.gateway.server.webflux.routes[4].id=usage-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://usage-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/usage/**

# ── Route 5: Scheduling + Conflicts (both under schedule-service)
spring.cloud.gateway.server.webflux.routes[5].id=schedule-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://schedule-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/schedules/**,/api/conflicts/**

# ── Route 6: Clause management
spring.cloud.gateway.server.webflux.routes[6].id=clause-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://Clause-Service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/clauses/**

# ── Route 7: Partner management
spring.cloud.gateway.server.webflux.routes[7].id=partner-service
spring.cloud.gateway.server.webflux.routes[7].uri=lb://Partner-Service
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/partners/**,/accessLogs/**

# ── Route 8: Contract management
spring.cloud.gateway.server.webflux.routes[8].id=contract-service
spring.cloud.gateway.server.webflux.routes[8].uri=lb://Contract-Service
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/contracts/**

# ── Route 9: Content Catalog (titles, assets, metadata)
spring.cloud.gateway.server.webflux.routes[9].id=content-catalog-service
spring.cloud.gateway.server.webflux.routes[9].uri=lb://catalog-service
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/api/titles/**,/api/assets/**,/api/metadata/**

# ── Route 10: Compliance checks
spring.cloud.gateway.server.webflux.routes[10].id=compliance-service
spring.cloud.gateway.server.webflux.routes[10].uri=lb://Compliance-Service
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/compliance/**

# ── Route 11: Notifications & Alert Rules
spring.cloud.gateway.server.webflux.routes[11].id=notification-service
spring.cloud.gateway.server.webflux.routes[11].uri=lb://Notification-Service
spring.cloud.gateway.server.webflux.routes[11].predicates[0]=Path=/api/notifications/**,/api/alerts-rules/**
