spring.application.name=schedule-service
server.port=1040
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

spring.datasource.url=jdbc:mysql://localhost:3306/schedule_database
spring.datasource.username=root
spring.datasource.password=ctssql2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.cloud.openfeign.circuitbreaker.enabled=false

resilience4j.retry.instances.feignRetry.max-attempts=3
resilience4j.retry.instances.feignRetry.wait-duration=2s
resilience4j.retry.instances.feignRetry.retry-exceptions=\
  feign.RetryableException,\
  java.io.IOException
