# CORS handled by CorsConfig.java (Java WebFilter) — see com.cts.config.CorsConfig
# De-duplicate CORS headers so downstream services adding their own @CrossOrigin('*')
# don't collide with the gateway's CORS and break browsers (browsers reject responses
# with multiple values in Access-Control-Allow-Origin).
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

