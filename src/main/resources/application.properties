spring.application.name=schedule-service
server.port=8081
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.datasource.url=jdbc:mysql://localhost:3306/schedule_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Enable Feign fallback support
spring.cloud.openfeign.circuitbreaker.enabled=true

# Retry config for contract-service
resilience4j.retry.instances.contractService.max-attempts=3
resilience4j.retry.instances.contractService.wait-duration=500ms
resilience4j.retry.instances.contractService.retry-exceptions=java.io.IOException,feign.FeignException

# Retry config for catalog-service
resilience4j.retry.instances.catalogService.max-attempts=3
resilience4j.retry.instances.catalogService.wait-duration=500ms
resilience4j.retry.instances.catalogService.retry-exceptions=java.io.IOException,feign.FeignException